<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IconsDrop Memory - Food Challenge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>IconsDrop Memory</h1>
    <h2>Food & Drink Challenge</h2>

    <div class="stats">
        <div>
            ⏱ Temps :
            <span id="timer">0</span>s
        </div>

        <div>
            🎯 Coups :
            <span id="moves">0</span>
        </div>
    </div>


    <div id="game-board"></div>


    <div id="win-message" class="hidden">

        <h2>🎉 Bravo !</h2>

        <p>
            Tu as trouvé toutes les icônes !
        </p>

        <p>
            Temps :
            <strong><span id="final-time"></span>s</strong>
        </p>

        <p>
            Coups :
            <strong><span id="final-moves"></span></strong>
        </p>

        <button onclick="restartGame()">
            Rejouer
        </button>

    </div>

</div>


<script src="game.js"></script>

</body>
</html>
