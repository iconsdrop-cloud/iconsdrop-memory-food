<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IconsDrop Memory Game</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- ========================= -->
        <!-- HOME SCREEN -->
        <!-- ========================= -->

        <section id="home-screen">

            <div class="home-content">

                <img
                    src="images/logo.png"
                    class="logo"
                    alt="IconsDrop Logo"
                >

                <h2>MEMORY GAME</h2>

                <h3>Food & Drink Collection</h3>

                <p class="description">
                    Discover and match premium 3D icons
                </p>

                <button onclick="startMemoryGame()">
                    START GAME
                </button>

            </div>

        </section>


        <!-- ========================= -->
        <!-- GAME SCREEN -->
        <!-- ========================= -->

        <section id="game-screen" class="hidden">

            <h1>IconsDrop Memory</h1>
<div class="game-header">
            <h2>Food & Drink Challenge</h2>
 <button class="restart-button" onclick="restartGame()">
        ↻
    </button>
</div>

<div class="top-stats">

    <div class="score-display">
 <img src="images/star.png" class="icons">
        Score : <span id="score">0</span>
    </div>

    <div class="time-display">
 <img src="images/stopwatch.png" class="icons">
        Time : <span id="timer">0</span>
    </div>

</div>
            <div class="stats">

              
 <div>
        <img src='images/restart.png' class='icons'/> Round :
        <span id="round">1</span>
    </div>
<div>
        <img src='images/fire.png' class='icons'/> Combo :
        <span id="combo">0</span>
    </div>

                <div>

                    <img src='images/target.png' class='icons'/> Moves :
                    <span id="moves">0</span>

                </div>

            </div>


            <div id="game-board"></div>

        </section>

<div id="combo-notification" class="hidden">

    <img id="combo-icon" src="" alt="combo">

    <div>

        <strong>
            COMBO x<span id="combo-value"></span> !
        </strong>

        <br>

        <span id="combo-points"></span>

    </div>

</div>


    <!-- ========================= -->
    <!-- WIN POPUP -->
    <!-- ========================= -->

    <div id="win-message" class="hidden">

        <div class="win-popup">

            <h2><img src='images/dead.png' class='icons'/> GAME OVER!</h2>

            <p>
               No more moves
            </p>

<p>

    <img src='images/star.png' class='icons'/> Score :
    <strong>
        <span id="final-score"></span>
    </strong>

</p>

            <p>

               <img src='images/stopwatch.png' class='icons'/>  Time :
                <strong>
                    <span id="final-time"></span>s
                </strong>

            </p>

            <p>

                <img src='images/target.png' class='icons'/> Moves :
                <strong>
                    <span id="final-moves"></span>
                </strong>

            </p>

<p>

    <img src='images/fire.png' class='icons'/> Best Combo :
    <strong>
        <span id="final-combo"></span>
    </strong>

</p>

            <button onclick="restartGame()">

                Play Again

            </button>

        </div>

    </div>


    <script src="game.js"></script>


    </div>

</div>

<div id="round-notification" class="hidden">

    <img src="images/trophy.png" id="combo-icon">

    <div class="round-content">

        <div id="round-title">ROUND CLEAR!</div>

        <div id="round-value">Round 2</div>

    </div>

</div></body>

</html>
